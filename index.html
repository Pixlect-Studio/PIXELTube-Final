<title>PIXELTube</title>
<script>
try {
  const savedTheme = localStorage.getItem('pixeltube-theme');
  const savedAccent = localStorage.getItem('pixeltube-accent');
  document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
  if (savedAccent) document.documentElement.dataset.accent = savedAccent;
} catch (error) {
  document.documentElement.dataset.theme = 'dark';
  console.warn('[PIXELTube] could not read saved theme:', error);
}
</script>
<!-- Backend API base. Empty = same origin (backend serves this site).
     If this frontend is hosted separately (GitHub Pages / Hostinger),
     set it to the backend URL, e.g.:
     window.PIXELTUBE_API_BASE = 'https://pixel-tube-final-backend.vercel.app'; -->
<script>window.PIXELTUBE_API_BASE = '';</script>
<script>
if ('serviceWorker' in navigator && window.isSecureContext) {
  navigator.serviceWorker.register('./service-worker.js')
    .catch(error => console.warn('[PIXELTube] service worker registration failed:', error));
}
</script>

<style>
  /* ============================================================
     SIMPLE LOADING SCREEN — logo + progress bar + status.
     Scoped under #loader so it can't affect the app's styles.
     ============================================================ */
  #loader{
    display:flex;align-items:center;justify-content:center;
    background:#06060a;color:#f8fafc;
    font-family:'Space Grotesk',sans-serif;user-select:none;
    transition:opacity .4s ease,visibility .4s ease;
  }
  #loader.hide{opacity:0;visibility:hidden;pointer-events:none}
  .loader-inner{display:flex;flex-direction:column;align-items:center;gap:24px}
  .loader-logo{
    width:190px;height:190px;border-radius:24px;background:#fff;padding:16px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 60px rgba(229,9,20,.18);
    animation:loaderPulse 1.6s ease-in-out infinite;
  }
  .loader-logo img{width:100%;height:100%;object-fit:contain;display:block}
  .loader-logo.logo-missing{
    background:linear-gradient(135deg,#e50914,#8c000c);
    font-family:'Silkscreen',monospace;font-size:13px;color:#fff;letter-spacing:.08em;
  }
  @keyframes loaderPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.97);opacity:.85}}
  .loader-bar{width:220px;height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .loader-bar span{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,#e50914,#ff2a6d);animation:loaderSlide 1.1s ease-in-out infinite}
  @keyframes loaderSlide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
  .loader-status{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#94a3b8;margin:0}
  @media (max-width:480px){ .loader-logo{width:140px;height:140px} }

  /* ============================================================
     CINEMATIC BOOTUP (from test-bootup.html) — scoped under #loader.
     Rendered inline (NO iframe). Shown when the bootup style is
     set to anything other than "Classic" in Settings.
     ============================================================ */
  #loader .loader-cinema{display:none;position:absolute;inset:0;z-index:1}
  #loader[data-boot-cinema="1"] .loader-cinema{display:flex;flex-direction:column;justify-content:space-between}
  #loader[data-boot-cinema="1"] .loader-classic{display:none}
  #loader .cinema-layer{position:absolute;inset:0;pointer-events:none;z-index:0}
  #loader .pixel-grid-overlay{background-image:linear-gradient(to right,rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.025) 1px,transparent 1px);background-size:20px 20px;opacity:.7}
  #loader .crt-scanlines{background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.42) 50%);background-size:100% 4px;opacity:.45}
  #loader #fx-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  #loader #screen-flash{position:absolute;inset:0;background:#fff;z-index:2;pointer-events:none;opacity:0;transition:opacity .45s ease-out}
  #loader #screen-flash.flash-now{opacity:.75;transition:none}
  #loader .cinema-hud{position:relative;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:20px 16px 0}
  #loader .cinema-pill{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:9999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1)}
  #loader #status-dot{width:8px;height:8px;border-radius:9999px;background:#00f5d4;animation:pixPing 1.2s ease-out infinite}
  @keyframes pixPing{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
  #loader #sequence-badge{font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#e2e8f0}
  #loader .cinema-audio{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:9999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:12px;cursor:pointer;pointer-events:auto;transition:background .2s,transform .15s}
  #loader .cinema-audio:hover{background:rgba(255,255,255,.14)}
  #loader .cinema-audio:active{transform:scale(.95)}
  #loader .cinema-stage{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px;text-align:center}
  #loader .emblem-box{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center;opacity:0;will-change:transform,opacity,filter,clip-path}
  @media (min-width:640px){#loader .emblem-box{width:164px;height:164px}}
  #loader .emblem-halo{position:absolute;inset:-28px;border-radius:9999px;background:radial-gradient(circle,rgba(229,9,20,.45) 0%,rgba(255,42,109,.22) 45%,rgba(0,245,212,.08) 70%,transparent 100%);filter:blur(22px);opacity:0;z-index:-1;transition:opacity .8s ease,transform .8s ease}
  #loader .emblem-halo.active{opacity:1;animation:haloBreath 3.5s ease-in-out infinite alternate}
  @keyframes haloBreath{0%{transform:scale(.95);opacity:.75}100%{transform:scale(1.12);opacity:1}}
  #loader .emblem-box img{width:100%;height:100%;object-fit:contain;border-radius:16px;user-select:none}
  #loader #logo-svg-fallback{display:none;width:100%;height:100%}
  #loader #logo-svg-fallback.show{display:flex;align-items:center;justify-content:center}
  #loader #logo-svg-fallback svg{width:100%;height:100%;overflow:visible}
  /* 5 emblem entrance keyframes */
  #loader .anim-ribbons{animation:introRibbons 1.45s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes introRibbons{0%{opacity:0;transform:scale(2.6);filter:blur(18px) brightness(2.5) drop-shadow(0 0 30px #e50914)}55%{opacity:1;transform:scale(.94);filter:blur(0) brightness(1.3) drop-shadow(0 0 28px rgba(229,9,20,.9))}78%{transform:scale(1.04)}100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 24px rgba(229,9,20,.65)) drop-shadow(0 0 48px rgba(255,42,109,.3))}}
  #loader .anim-console{animation:introConsole 1.25s steps(10,end) forwards}
  @keyframes introConsole{0%{opacity:0;transform:translateY(-110px) scale(.6);filter:contrast(2) brightness(1.8)}40%{opacity:1;transform:translateY(14px) scale(1.06,.92)}65%{transform:translateY(-12px) scale(.96,1.04)}85%{transform:translateY(4px) scale(1.02,.98)}100%{opacity:1;transform:translateY(0) scale(1);filter:drop-shadow(0 0 20px rgba(0,245,212,.55))}}
  #loader .anim-glitch{animation:introGlitch 1.2s cubic-bezier(.25,1,.5,1) forwards}
  @keyframes introGlitch{0%{opacity:0;transform:scale(.85) skewX(24deg);clip-path:inset(45% 0 45% 0);filter:drop-shadow(-14px 0 0 #00f5d4) drop-shadow(14px 0 0 #ff2a6d) brightness(2)}25%{opacity:1;transform:scale(1.05) skewX(-16deg) translateX(-10px);clip-path:inset(12% 0 18% 0);filter:drop-shadow(-10px 0 0 #00f5d4) drop-shadow(10px 0 0 #ff2a6d)}50%{transform:scale(.98) skewX(9deg) translateX(8px);clip-path:inset(0 0 0 0);filter:drop-shadow(6px 0 0 #00f5d4) drop-shadow(-6px 0 0 #e50914)}75%{transform:skewX(-4deg) translateX(-3px);filter:drop-shadow(-3px 0 0 #00f5d4) drop-shadow(3px 0 0 #ff2a6d)}100%{opacity:1;transform:scale(1) skewX(0) translateX(0);clip-path:inset(0 0 0 0);filter:drop-shadow(0 0 22px rgba(0,245,212,.5)) drop-shadow(0 0 36px rgba(255,42,109,.4))}}
  #loader .anim-warp{animation:introWarp 1.35s cubic-bezier(.19,1,.22,1) forwards}
  @keyframes introWarp{0%{opacity:0;transform:scale(.08) rotate(-12deg);filter:blur(16px) brightness(3)}60%{opacity:1;transform:scale(1.12) rotate(2deg);filter:blur(0) brightness(1.4) drop-shadow(0 0 34px #00f5d4)}100%{opacity:1;transform:scale(1) rotate(0);filter:drop-shadow(0 0 24px rgba(0,245,212,.6)) drop-shadow(0 0 42px rgba(229,9,20,.45))}}
  #loader .anim-laser{animation:introLaser 1.3s ease-out forwards}
  @keyframes introLaser{0%{opacity:0;transform:scale(.88);filter:brightness(3) drop-shadow(0 0 40px #ff2a6d) drop-shadow(0 0 40px #00f5d4)}45%{opacity:1;transform:scale(1.03);filter:brightness(1.5) drop-shadow(0 0 28px #ff2a6d)}100%{opacity:1;transform:scale(1);filter:brightness(1) drop-shadow(0 0 24px rgba(255,42,109,.65)) drop-shadow(0 0 36px rgba(0,245,212,.4))}}
  #loader .wordmark-row{margin-top:24px;display:flex;align-items:baseline;justify-content:center;letter-spacing:-.025em}
  #loader .wordmark-char{display:inline-block;opacity:0;transform:translateY(22px) scale(.85);filter:blur(6px);font-size:30px;font-weight:700;font-family:'Silkscreen',monospace;color:#fff;transition:transform .5s cubic-bezier(.16,1,.3,1),opacity .4s ease,filter .4s ease}
  #loader .wordmark-char.latin{font-family:'Space Grotesk',sans-serif;font-weight:800}
  #loader .wordmark-char.red{color:#e50914}
  @media (min-width:640px){#loader .wordmark-char{font-size:48px}}
  #loader .wordmark-char.visible{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
  #loader .laser-underline{height:3px;width:0%;max-width:340px;border-radius:9999px;background:linear-gradient(90deg,transparent,#00f5d4,#e50914,#ff2a6d,transparent);box-shadow:0 0 18px rgba(229,9,20,.85),0 0 28px rgba(0,245,212,.55);opacity:0;margin-top:14px;transition:width .85s cubic-bezier(.22,1,.36,1),opacity .35s ease}
  #loader .laser-underline.expand{width:82vw;opacity:1}
  #loader #boot-subtitle{margin-top:16px;font-family:'Silkscreen',monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#94a3b8;opacity:0;transition:opacity .7s ease}
  #loader #boot-subtitle.opacity-100{opacity:1}
  #loader .cinema-dock{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px 20px}
  #loader .cinema-random{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:9999px;background:linear-gradient(90deg,#e50914,#ff2a6d,#e50914);background-size:200% auto;color:#fff;font-weight:700;font-size:12px;font-family:'Space Grotesk',sans-serif;border:none;cursor:pointer;pointer-events:auto;box-shadow:0 10px 24px rgba(229,9,20,.35);transition:background-position .3s,transform .15s}
  #loader .cinema-random:hover{background-position:right}
  #loader .cinema-random:active{transform:scale(.95)}
  #loader .cinema-pills{display:flex;align-items:center;justify-content:flex-start;gap:8px;max-width:768px;width:100%;overflow-x:auto;scrollbar-width:none;padding:4px}
  #loader .cinema-pills::-webkit-scrollbar{display:none}
  @media (min-width:640px){#loader .cinema-pills{justify-content:center}}
  #loader .intro-pill{flex-shrink:0;padding:6px 14px;border-radius:9999px;font-size:11px;font-family:'Space Grotesk',sans-serif;font-weight:500;background:rgba(255,255,255,.05);color:#cbd5e1;border:1px solid rgba(255,255,255,.1);cursor:pointer;pointer-events:auto;transition:background .2s,transform .15s;white-space:nowrap}
  #loader .intro-pill:hover{background:rgba(255,255,255,.14)}
  #loader .intro-pill:active{transform:scale(.95)}
  #loader .intro-pill.current{background:#fff;color:#06060a;font-weight:700;border-color:#fff}
  @media (prefers-reduced-motion:reduce){#loader .emblem-box{animation:none!important;opacity:1;transform:none;filter:none}#loader .wordmark-char{opacity:1;transform:none;filter:none}}

  /* AUTO-boot solo mode: the intro plays by itself — hide the preview
     controls (Play Random button, intro pills, audio button). The
     whole stage is click-to-skip instead. */
  #loader.cinema-boot-solo .cinema-dock,
  #loader.cinema-boot-solo #audio-btn{display:none}
</style>
<style>
  #pixlect-login {
    background: linear-gradient(135deg, var(--accent), #5b8cff);
    color: #fff; border: none; padding: 8px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 700; cursor: pointer; display: flex;
    align-items: center; gap: 8px; transition: transform 0.15s, filter 0.15s;
    box-shadow: 0 4px 12px rgba(124, 92, 255, 0.3); font-family: inherit; margin-left: 12px;
  }
  #pixlect-login:hover { filter: brightness(1.1); transform: translateY(-1px); }
  #pixlect-login:disabled { opacity: 0.5; cursor: not-allowed; filter: none; transform: none; box-shadow: none; }
  .pixlect-user-badge {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel-2, #141d33); border: 1px solid var(--line, #22304f);
    padding: 4px 6px 4px 4px; border-radius: 999px; margin-left: 12px;
  }
</style>
</head>
<body>

      <div id="wordmark-row" class="wordmark-row" aria-label="PIXELTube">

<header class="topbar">
  <button class="icon-btn" data-action="menu" aria-label="Menu" type="button">

  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>

  <button class="settings-btn" data-settings-toggle type="button" aria-label="Open settings" title="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.75 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0-.05.94c0 .32.02.63.05.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.42.34.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54a7.03 7.03 0 0 0 1.62-.94l2.39.96c.23.09.47 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg>
